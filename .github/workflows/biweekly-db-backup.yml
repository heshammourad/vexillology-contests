name: Biweekly Heroku Backup

on:
  schedule:
    # Runs at 00:00 UTC on the 1st and 15th of every month
    - cron: '0 0 1,15 * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Heroku CLI
        run: |
          curl https://cli-assets.heroku.com/install.sh | sh

      - name: Capture Backup
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          heroku pg:backups:capture --app vexillology-contests
          echo "Backup captured successfully."

      - name: Download Backup
        id: download
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          filename="db-backup-$(date +%Y%m%d).dump"
          heroku pg:backups:download --app vexillology-contests --output "$filename"
          echo "filename=$filename" >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCS_BACKUP_SA_KEY }}

      - name: Upload Backup to GCS
        uses: google-github-actions/upload-cloud-storage@v2
        with:
          path: ${{ steps.download.outputs.filename }}
          destination: ${{ secrets.GCS_BACKUP_BUCKET }}
