name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull Request number to review'
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    runs-on: ubuntu-latest
    # Fork PRs don't get repo secrets on the `pull_request` event, so skip the
    # automatic run there rather than failing; review those via
    # workflow_dispatch (pr_number) instead, which does have secret access.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      # Dependabot and other bots open PRs with `github.event.pull_request.user.type == 'Bot'`.
      # Warn and skip the review for those instead of running (and failing) it.
      - name: Check PR author
        id: author
        env:
          IS_BOT: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.type == 'Bot' }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          if [ "$IS_BOT" = "true" ]; then
            echo "::warning::Skipping Claude PR review: PR opened by bot account '$AUTHOR'."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout PR
        uses: actions/checkout@v4
        if: github.event_name == 'pull_request' && steps.author.outputs.skip != 'true'
        with:
          fetch-depth: 1

      - name: Checkout PR (manual dispatch)
        uses: actions/checkout@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          ref: refs/pull/${{ inputs.pr_number }}/head
          fetch-depth: 1

      - name: Run Claude PR Review
        if: steps.author.outputs.skip != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}

            The PR branch is already checked out in the current working directory.
            Review the diff introduced by this PR (`gh pr diff`). Flag only what
            the PR adds or changes, not pre-existing code, but read the rest of
            the codebase (Read, Grep, Glob) wherever it helps judge the diff,
            for instance to find an existing helper or component the PR
            duplicates.

            Focus on:
            - Correctness bugs: logic errors, edge cases, and failure scenarios
              a reviewer would actually flag.
            - Conformance to the "Code standards" section of CLAUDE.md: one
              component per file, date-fns over hand-rolled date code, DRY
              (including reuse of existing helpers), names that say what the
              thing is, and no new `eslint-disable`. These are the repo owner's
              standing review rules, so flag every violation in the diff, even
              where it looks like a matter of style. Cite the rule's number.
            - Reuse, simplification, and efficiency: unnecessary complexity,
              duplicated logic, or code that could be simpler without changing
              behavior.
            - PR size: count changed lines (additions + deletions) with
              `gh pr view <PR NUMBER> --json files`, leaving out lockfiles
              (`package-lock.json`) and `server/db/schema.sql`. Over about 400,
              say so at the top of the comment, and suggest how to split the PR
              into a stack of smaller PRs (typically backend first, frontend
              second), naming which files go in which PR. If its base branch
              isn't `master`, it's already part of a stack: judge only its
              own diff.

            Skip formatting that Prettier and ESLint already handle, and skip
            generic praise. Skip suggestions that would require guessing about
            behavior or process that neither the code nor CLAUDE.md describes.
            CLAUDE.md's Code standards count as described.
            If there is nothing worth flagging, post a short comment saying so
            rather than inventing issues.

            Post your findings as a single top-level comment with
            `gh pr comment <PR NUMBER> --body "..."`. Do not submit a formal
            GitHub review, and do not leave inline comments.

          claude_args: |
            --allowedTools "Read,Grep,Glob,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
