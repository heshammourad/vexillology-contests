# Autopilot: picks the next tracker item and plans it, and wraps up the last one once it is live.
# The loop and its rules are in .claude/AUTOPILOT.md; the @claude half is claude.yml.
#
# It is driven by the staging *deployment* rather than the PR merge, because a merge isn't the moment
# anything is live yet. Heroku auto-deploys master to staging afterwards and reports each deploy
# back to GitHub as a deployment to `vexillology-contests-staging`, and that deploy's `success` is
# the moment the merge can be checked, and the right time to start the next item. Production is a
# manual promotion in Heroku's pipeline UI, and nothing here waits for it or triggers it.
#
# That event takes a relay: claude-code-action does not accept `deployment_status`, so the first job
# re-dispatches this workflow as `workflow_dispatch` (which a GITHUB_TOKEN may trigger, unlike every
# other event), and the real work runs there. The same dispatch, run by hand, is the manual nudge:
#
#   gh workflow run autopilot.yml                 # pick from the trackers
#   gh workflow run autopilot.yml -f issue=334    # plan a specific issue
#
# It is off unless the repository variable AUTOPILOT_ENABLED is 'true', for automatic and manual
# runs alike. @claude replies in claude.yml keep working while it is off.

name: Autopilot

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      issue:
        description: Plan this issue instead of picking from the trackers
        required: false
      merged_pr:
        description: Wrap up this merged PR first (set by the relay)
        required: false

# The dispatched runs are serialized and queued: the picker reads the `autopilot` label that the
# previous run's Claude adds, so two of them must never overlap. Relay runs get a group of their own
# per run. Every deployment_status event (pending, in_progress, production) starts a run even when
# all its jobs are skipped. A group holds one pending run, so sharing the group would let those
# runs cancel the dispatch the relay just queued, and its wrap-up with it.
#
# A pending dispatch superseded by a newer one is otherwise fine to lose, since both pick from the
# same state. The one exception is two Autopilot merges deploying within one run of each other:
# the earlier merge's wrap-up would be dropped. Run it by hand with -f merged_pr=N.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && 'autopilot' || format('autopilot-relay-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  relay:
    if: >-
      github.event_name == 'deployment_status'
      && vars.AUTOPILOT_ENABLED == 'true'
      && github.event.deployment_status.state == 'success'
      && github.event.deployment.environment == 'vexillology-contests-staging'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
      pull-requests: read
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ github.event.deployment.sha }}
    steps:
      - name: Dispatch the real run
        run: |
          set -euo pipefail
          # The PR whose merge produced this commit, if any (a redeploy or a direct push has none).
          pr=$(gh api "repos/$GH_REPO/commits/$SHA/pulls" --jq '[.[] | select(.merged_at != null)][0].number // empty')
          echo "Staging is live at $SHA (merged PR: ${pr:-none})." >> "$GITHUB_STEP_SUMMARY"
          gh workflow run autopilot.yml --ref master -f merged_pr="${pr}"

  pick:
    if: github.event_name == 'workflow_dispatch' && vars.AUTOPILOT_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write # only for the one-time "nothing left" note on the tracker
      pull-requests: read
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      INPUT_ISSUE: ${{ inputs.issue }}
      MERGED_PR: ${{ inputs.merged_pr }}
    outputs:
      issue: ${{ steps.pick.outputs.issue }}
      tracker: ${{ steps.pick.outputs.tracker }}
      wrapup_pr: ${{ steps.pick.outputs.wrapup_pr }}
    steps:
      - name: Pick
        id: pick
        run: |
          set -euo pipefail
          note() { echo "$1" | tee -a "$GITHUB_STEP_SUMMARY"; }

          # Wrap-up only for a merged PR that autopilot opened.
          wrapup=""
          if [ -n "$MERGED_PR" ] && gh pr view "$MERGED_PR" --json labels --jq '.labels[].name' | grep -qx autopilot; then
            wrapup="$MERGED_PR"
            note "Wrap up: PR #$wrapup."
          fi

          # Open trackers in number order. Milestones are sequential goals (CLAUDE.md), so the
          # lowest-numbered open tracker is the current one; later ones are reached only once it
          # has nothing pickable left.
          trackers=$(gh issue list --label tracking --state open --limit 100 --json number --jq 'sort_by(.number) | .[].number')

          issue="" tracker=""
          busy=$(gh issue list --label autopilot --state open --limit 100 --json number --jq '.[0].number // empty')
          if [ -n "$INPUT_ISSUE" ]; then
            issue="$INPUT_ISSUE"
            note "Plan: #$issue (requested by hand${busy:+; note #$busy is also in flight})."
          elif [ -n "$busy" ]; then
            note "Not picking: #$busy is still in flight (open, labelled autopilot)."
          else
            for t in $trackers; do
              # Unchecked lines, in order: "- [ ] #N" and "- [ ] **#N". Plain "- #N" bullets are
              # listed for context only and never picked.
              for n in $(gh issue view "$t" --json body --jq .body | grep -oE '^[[:space:]]*- \[ \] (\*\*)?#[0-9]+' | grep -oE '[0-9]+$'); do
                meta=$(gh issue view "$n" --json state,labels --jq '"\(.state) \([.labels[].name] | join(","))"')
                state=${meta%% *}; labels=",${meta#* },"
                [ "$state" = "OPEN" ] || continue
                case "$labels" in *,blocked,*|*,needs-input,*|*,autopilot,*|*,by-hand,*) continue;; esac
                # Someone is already on it: an open PR that says it closes this issue. Captured
                # first rather than piped, because under pipefail grep -q exiting early can SIGPIPE
                # gh and make a claimed issue look unclaimed.
                bodies=$(gh pr list --state open --search "$n in:body" --limit 100 --json body --jq '.[].body')
                if grep -qiE "(close[sd]?|fix(e[sd])?|resolve[sd]?) #$n([^0-9]|$)" <<< "$bodies"; then
                  continue
                fi
                issue="$n" tracker="$t"
                break 2
              done
            done
            if [ -n "$issue" ]; then
              note "Plan: #$issue, the next pickable item on tracker #$tracker."
            else
              note "Nothing pickable on any open tracker (everything is checked, closed, by-hand, blocked or waiting)."
              # Say so once on the current tracker, so a stopped loop is visible where Hesham looks.
              first=$(echo "$trackers" | head -1)
              if [ -n "$first" ] && ! gh issue view "$first" --json comments --jq '.comments[-1].body // ""' | grep -q 'autopilot:empty'; then
                gh issue comment "$first" --body "<!-- autopilot:empty -->
          Autopilot has nothing left to pick: every unchecked line on the open trackers is closed, \`by-hand\`, \`blocked\`, waiting on you, or already has a PR. It will pick again after the next staging deploy, or on \`gh workflow run autopilot.yml\`."
              fi
            fi
          fi

          {
            echo "issue=$issue"
            echo "tracker=${tracker:-$(echo "$trackers" | head -1)}"
            echo "wrapup_pr=$wrapup"
          } >> "$GITHUB_OUTPUT"

  claude:
    needs: pick
    if: needs.pick.outputs.issue != '' || needs.pick.outputs.wrapup_pr != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: write
      id-token: write # exchanged for the Claude GitHub App's token
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run Claude
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          # The relay dispatches this run with GITHUB_TOKEN, so the action sees github-actions[bot]
          # as the actor and by default refuses to start for a bot. Allowing it admits nothing new:
          # this workflow is reachable only by that relay or by a person with write access
          # dispatching it by hand. claude.yml doesn't get this; there, only the repository owner's
          # comments trigger it.
          allowed_bots: github-actions
          # Every `git push` is blocked: these runs only plan and wrap up, and both end in a comment.
          # claude.yml's Build phase has to push, so it blocks only the force forms.
          claude_args: |
            --model claude-opus-5-5
            --max-turns 150
            --allowedTools "Bash,Edit,MultiEdit,Write,Read,Glob,Grep,WebFetch,WebSearch"
            --disallowedTools "Bash(gh pr merge:*),Bash(gh pr review:*),Bash(gh pr close:*),Bash(gh secret:*),Bash(gh variable:*),Bash(gh workflow:*),Bash(gh repo:*),Bash(git push:*),Bash(heroku:*)"
          prompt: |
            This is an unattended autopilot run in ${{ github.repository }}. Before anything else,
            read .claude/AUTOPILOT.md and CLAUDE.md and follow them. Nobody is watching this run;
            everything you want Hesham to see goes in an issue comment.

            Current tracking issue: #${{ needs.pick.outputs.tracker }}.

            ${{ needs.pick.outputs.wrapup_pr != '' && format('Step 1, wrap-up: PR #{0} has merged and is live on staging. Do the Wrap-up phase for it.', needs.pick.outputs.wrapup_pr) || 'Step 1: no wrap-up this run.' }}

            ${{ needs.pick.outputs.issue != '' && format('Step 2, plan: do the Plan phase for issue #{0}, unless step 1 found a problem (AUTOPILOT.md says why). Write no code and push nothing.', needs.pick.outputs.issue) || 'Step 2: nothing to plan this run.' }}

      # The action hides Claude's output so that tool results never reach the log, which also hides
      # why a run failed. This prints only the run's final result message, which on a failure is
      # the error text, and nothing any tool returned.
      - name: Report why Claude failed
        if: failure()
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          file="${EXECUTION_FILE:-$RUNNER_TEMP/claude-execution-output.json}"
          msg=""
          [ -f "$file" ] && msg=$(jq -r '(if type == "array" then .[] else . end) | select(.type? == "result") | .result // empty' "$file" 2>/dev/null | head -c 2000)
          msg="${msg:-No result message was recorded; the failure was before or outside Claude.}"
          echo "$msg"
          { echo "### Why Claude failed"; echo; echo '```'; echo "$msg"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
